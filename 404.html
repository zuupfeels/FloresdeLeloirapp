    <script>
      (function() {
        // Interceptar conexiones WebSocket exclusivas de Vite HMR en iframe Cloud Run
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
              isViteHmr = true;
            }
            if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('24678') !== -1 || url.indexOf('vite-hmr') !== -1)) {
              isViteHmr = true;
            }
            if (isViteHmr) {
              var listeners = {};
              var fakeWs = {
                url: String(url),
                readyState: 1, // WebSocket.OPEN
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {},
                addEventListener: function(event, handler) {
                  listeners[event] = listeners[event] || [];
                  listeners[event].push(handler);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { handler({ type: 'open', target: fakeWs }); } catch(err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, handler) {
                  if (!listeners[event]) return;
                  listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              return fakeWs;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Suprimir cualquier error remanente de HMR o WebSocket
        function isViteHmrError(err, msg, file) {
          var str = String(err && err.message || '') + ' ' +
                    String(err && err.stack || '') + ' ' +
                    String(msg || '') + ' ' +
                    String(file || '');
          return str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
                 str.indexOf('@vite/client') !== -1 ||
                 str.indexOf('vite') !== -1;
        }
        window.addEventListener('error', function(e) {
          if (isViteHmrError(e.error, e.message, e.filename)) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isViteHmrError(e.reason)) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
