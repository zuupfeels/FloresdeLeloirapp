<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="folder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Base background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <!-- School / Folder Badge -->
  <g filter="url(#shadow)" transform="translate(64, 76)">
    <!-- Back folder tab -->
    <path d="M40 70 L150 70 L180 100 L344 100 A20 20 0 0 1 364 120 L364 160 L20 160 L20 90 A20 20 0 0 1 40 70 Z" fill="#059669" />
    
    <!-- Paper Sheet -->
    <rect x="52" y="110" width="280" height="200" rx="12" fill="#f8fafc" />
    <!-- Paper lines -->
    <rect x="80" y="145" width="130" height="14" rx="7" fill="#cbd5e1" />
    <rect x="80" y="175" width="224" height="10" rx="5" fill="#e2e8f0" />
    <rect x="80" y="197" width="224" height="10" rx="5" fill="#e2e8f0" />
    <rect x="80" y="219" width="180" height="10" rx="5" fill="#e2e8f0" />

    <!-- Front Folder Body -->
    <rect x="20" y="150" width="344" height="190" rx="20" fill="url(#folder)" />
    
    <!-- Shield / Seal -->
    <g transform="translate(192, 185)">
      <circle cx="0" cy="50" r="42" fill="#ffffff" filter="url(#shadow)" />
      <!-- Graduation / School Icon -->
      <path d="M-24 45 L0 33 L24 45 L0 57 Z" fill="#047857" />
      <path d="M-15 50.5 L-15 62 Q0 70 15 62 L15 50.5 L0 57.5 Z" fill="#065f46" />
      <path d="M20 47 L20 65 L17 65 L17 48.5 Z" fill="#047857" />
    </g>
  </g>

  <!-- JUNTOS Brand Text -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">LEGAJOS JUNTOS</text>
  <text x="256" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#a7f3d0" letter-spacing="2" text-anchor="middle">ESCUELA ESPECIAL</text>
</svg>
